name: Validate game and iOS bundle
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          node test.mjs
          node test-progress.mjs
          node test-pack.mjs
          node test-expansion.mjs
          node test-campaign80.mjs
          node scripts/build-ios-web.mjs --check
# This Linux workflow is not a native Xcode build or WKWebView runtime test.
