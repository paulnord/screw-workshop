name: Test and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify physics routes and progression
        run: |
          node test.mjs
          node test-contact-orders.mjs
          node test-progress.mjs
          node test-pack.mjs
          node test-expansion.mjs
          node test-campaign80.mjs
          node test-daily-data.mjs
          node test-daily-engine.mjs
          node test-daily-content.mjs
          node test-daily-ui.mjs
          node test-shapes.mjs
          node test-progress-sync.mjs
          node test-firebase-adapter.mjs
          node test-account-ui.mjs
          node test-daily-summary.mjs
          node test-daily-sync.mjs
      - name: Verify account storage with local emulators
        run: npm run test:emulators
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
