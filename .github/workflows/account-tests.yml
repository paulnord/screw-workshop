name: Optional account validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate account isolation and data rules
        run: |
          node test-progress-sync.mjs
          node test-daily-sync.mjs
          node test-daily-summary.mjs
          node test-firebase-adapter.mjs
          node test-account-ui.mjs
          npm run test:emulators
      - name: Preserve guest and daily play
        run: |
          node test-progress.mjs
          node test-daily-data.mjs
          node test-daily-ui.mjs
          node test.mjs
